  <rect x="60" y="360" width="1000" height="120" rx="10" fill="#141417" stroke="#2A2A30"/>
  <text x="88" y="400" fill="#8A8A92" font-size="13" letter-spacing="2">RÔLE</text>
  <text x="88" y="436" fill="#ECECEE" font-size="16">Présent de la discovery au prototype · réalisation design attribuée à 100 %.</text>
  <text x="88" y="462" fill="#8A8A92" font-size="14">Product Trio : PM · Designer · Lead Dev, sous cadrage de la Lead Designer.</text>
