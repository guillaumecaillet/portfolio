<svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect width="1120" height="560" fill="#0B0B0C"/>
  <text x="60" y="80" fill="#8A8A92" font-size="14" letter-spacing="3">MÉTHODE</text>
  <text x="60" y="120" fill="#ECECEE" font-size="30" font-weight="600">FOCUSED, de bout en bout</text>
  <text x="60" y="152" fill="#8A8A92" font-size="15">Chaque étape rattachée à une contribution design concrète.</text>

  <!-- spine -->
  <line x1="92" y1="230" x2="1028" y2="230" stroke="#2A2A30"/>

  <!-- nodes -->
  <g>
    <circle cx="92" cy="230" r="7" fill="#2937FF"/>
    <text x="92" y="200" fill="#ECECEE" font-size="20" font-weight="600" text-anchor="middle">F</text>
    <text x="92" y="266" fill="#ECECEE" font-size="13" text-anchor="middle">Frame</text>
    <text x="92" y="286" fill="#6A6A72" font-size="11" text-anchor="middle">2 briefs</text>
  </g>
  <g>
    <circle cx="226" cy="230" r="7" fill="#2937FF"/>
    <text x="226" y="200" fill="#ECECEE" font-size="20" font-weight="600" text-anchor="middle">O</text>
    <text x="226" y="266" fill="#ECECEE" font-size="13" text-anchor="middle">Observe</text>
    <text x="226" y="286" fill="#6A6A72" font-size="11" text-anchor="middle">entretiens</text>
  </g>
  <g>
    <circle cx="360" cy="230" r="7" fill="#2937FF"/>
    <text x="360" y="200" fill="#ECECEE" font-size="20" font-weight="600" text-anchor="middle">C</text>
    <text x="360" y="266" fill="#ECECEE" font-size="13" text-anchor="middle">Claim</text>
    <text x="360" y="286" fill="#6A6A72" font-size="11" text-anchor="middle">proposition de valeur</text>
  </g>
  <g>
    <circle cx="494" cy="230" r="7" fill="#2937FF"/>
    <text x="494" y="200" fill="#ECECEE" font-size="20" font-weight="600" text-anchor="middle">U</text>
    <text x="494" y="266" fill="#ECECEE" font-size="13" text-anchor="middle">Unfold</text>
    <text x="494" y="286" fill="#6A6A72" font-size="11" text-anchor="middle">moments-clés</text>
  </g>
  <g>
    <circle cx="628" cy="230" r="7" fill="#2937FF"/>
    <text x="628" y="200" fill="#ECECEE" font-size="20" font-weight="600" text-anchor="middle">S</text>
    <text x="628" y="266" fill="#ECECEE" font-size="13" text-anchor="middle">Steal</text>
    <text x="628" y="286" fill="#6A6A72" font-size="11" text-anchor="middle">Adobe · Shopify · Google</text>
  </g>
  <g>
