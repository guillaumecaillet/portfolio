<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <rect width="1120" height="620" fill="#0B0B0C"/>
  <text x="60" y="80" fill="#8A8A92" font-size="14" letter-spacing="3">DÉCISION DE CONCEPTION</text>
  <text x="60" y="120" fill="#ECECEE" font-size="30" font-weight="600">Du flou à deux niveaux nets</text>
  <text x="60" y="152" fill="#8A8A92" font-size="15">Remplacer un dégradé d'étoiles illisible par une frontière claire.</text>

  <!-- Avant -->
  <rect x="60" y="196" width="440" height="150" rx="10" fill="#141417" stroke="#2A2A30"/>
  <text x="88" y="236" fill="#6A6A72" font-size="13" letter-spacing="2">AVANT</text>
  <text x="88" y="272" fill="#8A8A92" font-size="16">« Rejoindre » · « badge » · « expert »</text>
  <text x="88" y="298" fill="#8A8A92" font-size="16">1 / 2 / 3 étoiles · « certifié »</text>
  <text x="88" y="326" fill="#6A6A72" font-size="14">Confus pour les experts comme en interne.</text>

  <!-- Niveau 1 -->
  <rect x="60" y="392" width="440" height="180" rx="10" fill="#141417" stroke="#2A2A30"/>
  <text x="88" y="432" fill="#8A8A92" font-size="13" letter-spacing="2">NIVEAU 1 — GRATUIT</text>
  <text x="88" y="468" fill="#ECECEE" font-size="22" font-weight="600">PrestaShop Expert / Membre</text>
  <text x="88" y="502" fill="#8A8A92" font-size="14">Déclare ses boutiques · cumule des points</text>
  <text x="88" y="526" fill="#8A8A92" font-size="14">« Salle d'attente »</text>
  <text x="88" y="552" fill="#6A6A72" font-size="14">Aucune reconnaissance ni visibilité annuaire</text>

  <!-- Niveau 2 highlighted -->
  <rect x="620" y="392" width="440" height="180" rx="10" fill="#0E1330" stroke="#2937FF" stroke-width="1.5"/>
  <text x="648" y="432" fill="#7E8Cff" font-size="13" letter-spacing="2">NIVEAU 2 — PREMIUM · 1 000 €/AN</text>
  <text x="648" y="468" fill="#ECECEE" font-size="22" font-weight="600">PrestaShop Certified Expert</text>
  <text x="648" y="502" fill="#B9C0FF" font-size="14">Tous les bénéfices · visibilité annuaire</text>
  <text x="648" y="526" fill="#B9C0FF" font-size="14">Accompagnement · badge partageable</text>
  <text x="648" y="552" fill="#B9C0FF" font-size="14">1 certification incluse par an</text>

  <!-- Gate arrow -->
  <line x1="500" y1="482" x2="620" y2="482" stroke="#2937FF" stroke-width="1.5"/>
  <path d="M 612 476 L 622 482 L 612 488 Z" fill="#2937FF"/>
  <text x="512" y="472" fill="#7E8Cff" font-size="12">paiement</text>
