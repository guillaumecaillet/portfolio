<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Anthracite background -->
  <rect width="1200" height="630" fill="#2a2a2d"/>

  <!-- Subtle vignette -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="40%" r="75%">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- GC monogram circle (top-left) -->
  <g transform="translate(80,80)">
    <circle cx="32" cy="32" r="32" fill="#ffffff"/>
    <text x="32" y="41" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif"
          font-size="22" font-weight="700" fill="#2a2a2d">GC</text>
  </g>

  <!-- Title -->
  <text x="80" y="280"
        font-family="Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#ffffff">
    Guillaume Caillet
  </text>

  <!-- Subtitle -->
  <text x="80" y="335"
        font-family="Helvetica, Arial, sans-serif"
        font-size="34" font-weight="400" fill="rgba(255,255,255,0.75)">
    Senior Product Designer
  </text>

  <!-- Tagline -->
  <text x="80" y="430"
        font-family="Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="rgba(255,255,255,0.55)">
    Designing complex B2B SaaS products
  </text>
  <text x="80" y="462"
        font-family="Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="rgba(255,255,255,0.55)">
    7+ years · France
  </text>

  <!-- Bottom signature line -->
  <line x1="80" y1="540" x2="120" y2="540" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <text x="135" y="546"
        font-family="Helvetica, Arial, sans-serif"
        font-size="16" font-weight="400" fill="rgba(255,255,255,0.45)">
    guillaumecaillet.fr
  </text>
</svg>
